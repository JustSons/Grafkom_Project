<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Predator – R.E.P.O.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0d0d14; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            user-select: none;
        }
        #mycanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        #mycanvas:active { cursor: grabbing; }

        /* HUD Panel */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(18, 20, 32, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 390px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        /* Status Controls & Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: #ffd21a;
        }
        .badge {
            font-size: 0.68rem;
            padding: 2px 7px;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge.active {
            background: rgba(38, 194, 129, 0.25);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.4);
        }
        .badge.inactive {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.35);
        }
    </style>
</head>
<body>
    <canvas id="mycanvas"></canvas>

    <div class="hud">
        <div class="btn-group">
            <button class="btn" onclick="toggleWalk()">
                <span>Animasi Jalan [W]</span>
                <span id="walk-status" class="badge active">AKTIF</span>
            </button>
            <button class="btn" onclick="togglePredator()">
                <span>Mode Paruh [Space]</span>
                <span id="pred-status" class="badge inactive">NORMAL</span>
            </button>
        </div>

    <script src="libs.js"></script>
    <script src="main.js"></script>
</body>
</html>
